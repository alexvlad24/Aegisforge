id: T01_refund_cumulative_cap
bug: B1
title: Refunds are checked against the order total, not the remaining balance
issue: |
  Several partial refunds on the same order can add up to more than the order total.
  Each refund is checked on its own against the order total, so the sum is never capped.
writable_paths: [shop/]
visible_tests:
