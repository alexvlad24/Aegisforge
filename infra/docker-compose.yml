# SPEC §4 / §5.1 / §5.3. Run via `make up` (uses --project-directory . and .env at repo root).
name: aegisforge

networks:
  # internal: true -> no route to the internet (S-03). Sandboxes attach here only.
  sandbox_net:
    name: aegis_sandbox_net
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Host-side services and published ports.
  db_net:
    name: aegis_db_net
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  postgres:
    build: ./infra/postgres
    image: aegis-postgres:16
    container_name: aegis-postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PW:?run make env first}
      # Read by init/01_roles.sql through psql \getenv. Never copied into a sandbox.
      HARNESS_PW: ${HARNESS_PW:?run make env first}
      AGENT_RW_PW: ${AGENT_RW_PW:?run make env first}
      INTAKE_READER_PW: ${INTAKE_READER_PW:?run make env first}
      TEST_RUNNER_PW: ${TEST_RUNNER_PW:?run make env first}
    volumes:
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      sandbox_net:
        ipv4_address: 172.30.0.10
      db_net:
        ipv4_address: 172.31.0.10
    ports:
      # Host port 5432 is already bound on the Windows host; publish on 55432 instead.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    container_name: aegis-phoenix
    networks:
      - db_net
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"

volumes:
  pgdata:
