# SPEC §5.1 (Fix 1). Postgres 16 regex database names use a leading "/".
# Subnets are fixed in infra/docker-compose.yml.
#
# TYPE   DATABASE        USER           ADDRESS          METHOD
local    all             postgres                        peer

# Sandbox subnet (172.30.0.0/24): only test_runner, only run_* databases.
host     "/^run_"        test_runner    172.30.0.0/24    scram-sha-256
host     all             all            172.30.0.0/24    reject

# Host-side services. Published ports (127.0.0.1) arrive from the db_net gateway,
# 172.31.0.1; the subnet covers it. Verified with inet_client_addr() in tests/security.
host     "/^run_"        agent_rw       172.31.0.0/24    scram-sha-256
host     "/^run_"        intake_reader  172.31.0.0/24    scram-sha-256
host     harness_db      harness        172.31.0.0/24    scram-sha-256
host     all             postgres       172.31.0.0/24    scram-sha-256

# Everything else is refused.
host     all             all            0.0.0.0/0        reject
