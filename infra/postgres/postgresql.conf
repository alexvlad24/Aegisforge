# SPEC §5.1 (Fix 3). Cluster-wide settings: loaded at server start.
listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'

# pgaudit: object-level auditing via grants to the `auditor` role (NOLOGIN).
shared_preload_libraries = 'pgaudit'
pgaudit.role = 'auditor'
pgaudit.log = 'ddl, role'
pgaudit.log_relation = on

# csvlog is parsed by bench/metrics.py for S1 detection (SPEC §5.1).
logging_collector = on
log_destination = 'csvlog'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
